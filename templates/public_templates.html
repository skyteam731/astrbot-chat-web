{% extends 'base.html' %}
{% block body %}
<main class="admin-wrap public-template-admin">
  <header class="account-page-header">
    <a class="back-link" href="{{ url_for('admin') }}"><span aria-hidden="true">←</span> 账号管理</a>
    <div class="account-heading"><div><h1>公共模板</h1><p class="muted">所有账号都可以选用这些模板。</p></div></div>
  </header>
  <section class="admin-card account-card public-template-panel" aria-labelledby="publicTemplateHeading">
    <div class="public-template-toolbar">
      <div class="account-card-heading"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 4.5h8l4 4v11h-12z"/><path d="M14.5 4.5v4h4m-8 4h5m-5 3h5"/></svg></span><div><h2 id="publicTemplateHeading">模板</h2></div></div>
      <button id="createPublicTemplate" class="primary" type="button">＋ 新建模板</button>
    </div>
    <label class="public-template-search"><span aria-hidden="true">⌕</span><input id="publicTemplateSearch" type="search" placeholder="搜索模板" aria-label="搜索公共提示模板"></label>
    <div id="publicTemplateNotice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="publicTemplateList" class="public-template-list" aria-live="polite"><p class="public-template-loading">正在读取模板…</p></div>
  </section>
</main>

<dialog id="publicTemplateEditor" class="public-template-dialog" aria-labelledby="publicTemplateDialogTitle">
  <form id="publicTemplateForm" class="public-template-dialog-body">
    <header class="public-template-dialog-header"><div><p class="eyebrow">公共模板</p><h2 id="publicTemplateDialogTitle">新建模板</h2></div><button class="public-template-close" type="button" data-close-editor aria-label="关闭">×</button></header>
    <label>模板名称<input id="publicTemplateName" name="name" maxlength="80" required autocomplete="off" placeholder="例如：文章润色"></label>
    <label>模板正文<textarea id="publicTemplateContent" name="content" maxlength="20000" rows="11" required placeholder="输入模板内容"></textarea><small class="public-template-help">最多 20,000 字。用户可编辑后再发送。</small></label>
    <p id="publicTemplateFormError" class="public-template-form-error" role="alert" hidden></p>
    <footer class="public-template-form-actions"><button class="secondary" type="button" data-close-editor>取消</button><button id="savePublicTemplate" class="primary" type="submit">保存模板</button></footer>
  </form>
</dialog>

<dialog id="publicTemplateDeleteDialog" class="public-template-dialog public-template-confirm" aria-labelledby="publicTemplateDeleteTitle">
  <div class="public-template-dialog-body"><header class="public-template-dialog-header"><div><p class="eyebrow">公共模板</p><h2 id="publicTemplateDeleteTitle">删除模板？</h2></div><button class="public-template-close" type="button" data-close-delete aria-label="关闭">×</button></header><p id="publicTemplateDeleteCopy" class="public-template-delete-copy"></p><p id="publicTemplateDeleteError" class="public-template-form-error" role="alert" hidden></p><footer class="public-template-form-actions"><button class="secondary" type="button" data-close-delete>取消</button><button id="confirmPublicTemplateDelete" class="danger-button" type="button">删除模板</button></footer></div>
</dialog>
<script src="{{ url_for('static', filename='admin-templates.js', v='1.4.0') }}"></script>
{% endblock %}
