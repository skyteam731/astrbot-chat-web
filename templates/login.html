{% extends 'base.html' %}{% block body %}<main class="login-wrap"><section class="login-card"><div class="login-brand"><h1>请输入文本工作室</h1></div><h2>登录</h2>{% for category,message in notices %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>用户名<input name="username" required autocomplete="username" autofocus></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button class="primary full" type="submit">登录</button></form></section></main>{% endblock %}
