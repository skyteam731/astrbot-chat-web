{% extends 'base.html' %}
{% block body %}
<main class="login-wrap">
  <section class="login-card" aria-labelledby="loginTitle">
    <a class="account-brand" href="{{ url_for('login') }}" aria-label="请输入文本工作室">
      <img class="account-brand-mark" src="{{ url_for('static', filename='studio-mark.svg') }}" alt="">
      <span class="account-brand-name">请输入文本工作室</span>
    </a>

    <header class="login-intro"><h1 id="loginTitle">登录</h1></header>
    {% for category,message in notices %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

    <form class="login-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label>账号<input name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus></label>
      <label>密码<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="primary full login-submit" type="submit">登录</button>
    </form>
  </section>
</main>
{% endblock %}
