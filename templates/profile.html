{% extends 'base.html' %}{% block body %}<main class="admin-wrap profile-wrap"><a class="back-link" href="{{ url_for('index') }}">← 返回工作台</a><header class="admin-head"><p class="eyebrow">个人设置</p><h1>个人资料</h1><p class="muted">管理你的显示姓名和登录密码。</p></header>{% for category,message in notices %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}<section class="admin-card"><h2>显示资料</h2><form class="profile-form" method="post" action="{{ url_for('profile') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if error %}<div class="error">{{ error }}</div>{% endif %}<label>真实姓名<input name="real_name" value="{{ user.real_name }}" placeholder="用于欢迎语" maxlength="40" autocomplete="name"></label><p class="profile-account">登录账号　<b>{{ user.username }}</b></p><button class="primary" type="submit">保存资料</button></form></section><section class="admin-card"><h2>修改登录密码</h2><form class="profile-form" method="post" action="{{ url_for('change_own_password') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>当前密码<input name="current_password" type="password" autocomplete="current-password" required></label><label>新密码<input name="new_password" type="password" minlength="12" autocomplete="new-password" placeholder="至少 12 位" required></label><label>再次输入新密码<input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></label><button class="primary" type="submit">更新密码</button></form></section></main>{% endblock %}
